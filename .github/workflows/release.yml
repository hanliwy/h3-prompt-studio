name: Build Desktop Release (Windows, macOS & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web & Server
        run: npm run build

      - name: Build & Package Desktop App
        env:
          # electron-builder 要求 GH_TOKEN（不是 GITHUB_TOKEN）才会真正上传到 Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 无 Apple 签名证书，跳过 macOS 代码签名/公证
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always

      - name: Upload artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore
